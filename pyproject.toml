[project]
name = "kase-pilot"
version = "1.0.0rc1"
description = "Personal investment assistant for Freedom Broker / Tradernet"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Aset" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "cssselect>=1.3.0",
    "tradernet-sdk==2.2.0",
]

[project.scripts]
kase-pilot = "kase_pilot.main:main"

[tool.setuptools.package-data]
kase_pilot = ["catalog/data/*.json"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
