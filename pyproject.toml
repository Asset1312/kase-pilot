[project]
name = "kase-pilot"
version = "0.1.0"
description = "Personal investment assistant for Freedom Broker / Tradernet"
readme = "README.md"
requires-python = ">=3.14"

authors = [
    { name = "Aset" }
]

dependencies = []

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"